# 컨슈머가 뒤처지거나 메시지를 버리기 시작하는 순간을 잡는다.
#
# DLQ 깊이 자체는 CloudWatch에만 있어 여기서 쓸 수 없다. 대신 DLQ로 가기 전에
# 먼저 움직이는 지표(스키마 위반, 쓰기 실패)를 본다. DLQ에 쌓인 뒤에 아는 것보다
# 쌓이기 시작할 때 아는 편이 낫다.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: {{ include "app.name" . }}
  labels:
    {{- include "app.labels" . | nindent 4 }}
spec:
  groups:
    - name: event-consumer
      rules:
        - alert: ConsumerBacklogGrowing
          # 상한까지 늘어난 뒤에도 큐가 목표치를 계속 넘는다는 뜻이다.
          # 파드당 목표({{ .Values.keda.queueLength }}) × 상한({{ .Values.keda.maxReplicaCount }})이 기준선이다.
          expr: max(keda_scaler_metrics_value{scaledObject="{{ include "app.name" . }}"}) > {{ mul .Values.keda.queueLength .Values.keda.maxReplicaCount }}
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "컨슈머가 유입을 따라가지 못한다"
            description: >-
              큐 길이가 {{ mul .Values.keda.queueLength .Values.keda.maxReplicaCount }}건을 10분 넘게 웃돌고 있다.
              레플리카는 이미 상한({{ .Values.keda.maxReplicaCount }})이므로 더 늘어나지 않는다.
              상한을 올리거나 발행량을 줄여야 한다.

        - alert: ConsumerInvalidMessages
          # 한 건이라도 나오면 발행 측 계약이 깨진 것이다. 이 메시지들은 재전달을
          # 3회 반복한 뒤 DLQ로 간다 (DECISIONS 009).
          expr: increase(adspectrum_messages_invalid_total[10m]) > 0
          for: 0m
          labels:
            severity: warning
          annotations:
            summary: "스키마를 위반한 메시지가 들어온다"
            description: >-
              최근 10분 동안 {{ "{{ $value | printf \"%.0f\" }}" }}건이 스키마 검증에 실패했다.
              재전달 3회를 넘기면 DLQ로 이동한다. 발행 측 변경을 먼저 확인한다.

        - alert: ConsumerWriteFailures
          # 집계 쓰기가 실패하면 그 메시지는 삭제되지 않고 재전달된다.
          # 원인이 지속되면 큐가 쌓이다가 DLQ로 흘러간다.
          expr: increase(adspectrum_dynamodb_write_failures_total[10m]) > 0
          for: 0m
          labels:
            severity: critical
          annotations:
            summary: "DynamoDB 집계 쓰기가 실패한다"
            description: >-
              최근 10분 동안 쓰기가 {{ "{{ $value | printf \"%.0f\" }}" }}회 실패했다.
              IRSA 권한, 테이블 존재 여부, 스로틀링을 확인한다.
