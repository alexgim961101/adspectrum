# 큐 길이를 보고 레플리카를 조절한다. Deployment에 replicas를 적지 않는 이유가
# 여기 있다 — 레플리카 수를 주장하는 곳이 둘이면 ArgoCD의 selfHeal이 KEDA가 내린
# 결정을 되돌린다. 소유자를 KEDA 하나로 못 박는다.
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: {{ include "app.name" . }}
  labels:
    {{- include "app.labels" . | nindent 4 }}
spec:
  scaleTargetRef:
    name: {{ include "app.name" . }}
  minReplicaCount: {{ .Values.keda.minReplicaCount }}
  maxReplicaCount: {{ .Values.keda.maxReplicaCount }}
  # 0으로 내리기 전 대기 시간. 짧으면 큐가 잠깐 빌 때마다 파드가 죽고 살아난다.
  cooldownPeriod: {{ .Values.keda.cooldownPeriod }}
  triggers:
    - type: aws-sqs-queue
      metadata:
        queueURL: {{ required "env.QUEUE_URL이 필요하다" .Values.env.QUEUE_URL }}
        awsRegion: {{ .Values.env.AWS_REGION }}
        # 파드 하나가 맡을 목표 메시지 수. 큐가 500이면 5개까지 올라간다.
        queueLength: "{{ .Values.keda.queueLength }}"
        # 큐 길이 조회는 컨슈머 파드가 아니라 keda-operator의 IRSA로 한다
        # (deploy/apps/keda.yaml). 스케일링 판단 권한을 워크로드에 주지 않는다.
        identityOwner: operator
