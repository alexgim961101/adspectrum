apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.serviceAccount.name }}
  labels:
    {{- include "app.labels" . | nindent 4 }}
  annotations:
    # IRSA. 이 어노테이션이 있어야 EKS가 파드에 웹 아이덴티티 토큰을 주입하고,
    # boto3가 그 토큰으로 역할을 맡는다. 노드 역할을 빌려 쓰지 않는다.
    eks.amazonaws.com/role-arn: {{ required "serviceAccount.roleArn이 필요하다" .Values.serviceAccount.roleArn }}
