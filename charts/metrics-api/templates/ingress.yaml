{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "app.name" . }}
  labels:
    {{- include "app.labels" . | nindent 4 }}
  annotations:
    alb.ingress.kubernetes.io/scheme: internet-facing
    # ip 모드는 ALB가 노드가 아니라 파드 IP를 직접 대상으로 잡는다. VPC CNI가
    # 파드에 VPC IP를 주기 때문에 가능하고, 가중치 카나리에도 필요하다 —
    # 인스턴스 모드는 NodePort 단위라 안정/카나리 파드를 갈라 낼 수 없다.
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/healthcheck-path: /healthz
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}]'
    # 같은 그룹의 Ingress들이 ALB 하나를 공유한다. ALB는 시간당 과금이라
    # 개수를 늘리지 않는 편이 낫다.
    alb.ingress.kubernetes.io/group.name: {{ .Values.ingress.groupName }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "app.name" . }}-stable
                port:
                  # 포트 번호가 아니라 이름 use-annotation을 준다. ALB 컨트롤러는
                  # 이 이름을 보면 서비스로 바로 보내지 않고
                  # alb.ingress.kubernetes.io/actions.metrics-api-stable 어노테이션의
                  # 가중치 규칙을 따른다. 그 어노테이션은 Rollouts가 배포 단계마다
                  # 직접 고쳐 쓰므로 여기에 적지 않는다 — 적으면 Git과 컨트롤러가
                  # 같은 필드를 두고 다툰다.
                  name: use-annotation
{{- end }}
