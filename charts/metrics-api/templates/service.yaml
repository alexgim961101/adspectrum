{{/*
안정 버전과 카나리 버전에 서비스를 하나씩 둔다. Rollouts가 두 서비스의 셀렉터에
파드 템플릿 해시를 넣어 두 무리를 갈라 놓고, ALB는 각 서비스의 타깃 그룹에
가중치를 나눠 준다. 서비스가 하나면 나눌 대상이 없어 가중치 카나리가 성립하지 않는다.
*/}}
{{- range $role := list "stable" "canary" }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "app.name" $ }}-{{ $role }}
  labels:
    {{- include "app.labels" $ | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - name: http
      port: {{ $.Values.service.port }}
      targetPort: http
  # 여기에 적는 것은 기본 셀렉터뿐이다. 배포 중에는 Rollouts가
  # rollouts-pod-template-hash를 덧붙여 두 서비스가 서로 다른 파드를 가리키게 한다.
  selector:
    {{- include "app.selectorLabels" $ | nindent 4 }}
{{- end }}
