# Deployment가 아니라 Rollout이다. 새 버전을 20% → 50% → 100%로 넓히면서
# 단계마다 카나리 파드의 에러율을 Prometheus에 물어보고, 기준을 넘으면 스스로
# 이전 버전으로 되돌린다.
apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: {{ include "app.name" . }}
  labels:
    {{- include "app.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  strategy:
    canary:
      # 배포 중에는 Rollouts가 이 두 서비스의 셀렉터를 갈라 놓는다
      # (templates/service.yaml).
      canaryService: {{ include "app.name" . }}-canary
      stableService: {{ include "app.name" . }}-stable
      trafficRouting:
        # 레플리카 비율이 아니라 ALB 가중치로 나눈다. 레플리카 2개로는 20%를
        # 표현할 수 없고, 표현하려고 레플리카를 늘리면 노드 자리를 그만큼 먹는다.
        alb:
          ingress: {{ include "app.name" . }}
          servicePort: {{ .Values.service.port }}
      steps:
        - setWeight: 20
        # 분석 단계는 결과가 나올 때까지 진행을 멈춘다. 실패하면 Rollouts가 스스로
        # 배포를 중단하고 가중치를 안정 버전 100%로 되돌린다 — 이것이 자동 롤백이다.
        - analysis:
            templates:
              - templateName: {{ include "app.name" . }}-error-rate
            args:
              # 방금 뜬 카나리 ReplicaSet의 파드 템플릿 해시. 이 값이 있어야 분석
              # 쿼리가 안정 파드를 섞지 않고 카나리만 본다.
              - name: pod-hash
                valueFrom:
                  podTemplateHashValue: Latest
        - setWeight: 50
        - analysis:
            templates:
              - templateName: {{ include "app.name" . }}-error-rate
            args:
              - name: pod-hash
                valueFrom:
                  podTemplateHashValue: Latest
  selector:
    matchLabels:
      {{- include "app.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "app.labels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ .Values.serviceAccount.name }}
      # 레플리카가 같은 노드에 몰리면 spot 회수 한 번에 API가 통째로 내려간다
      # (SPEC 13장의 위험 항목). 노드별로 고르게 흩는다.
      #
      # ScheduleAnyway라 노드가 하나뿐이면 그냥 같은 노드에 뜬다. DoNotSchedule로
      # 두면 노드가 한 대 남은 상황에서 파드가 Pending에 걸려, 가용성을 지키려던
      # 설정이 오히려 가용성을 깨뜨린다.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              {{- include "app.selectorLabels" . | nindent 14 }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: app
          image: "{{ required "image.repository가 필요하다" .Values.image.repository }}:{{ required "image.tag가 필요하다" .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          env:
            {{- range $key, $value := .Values.env }}
            - name: {{ $key }}
              value: {{ $value | quote }}
            {{- end }}
          ports:
            - name: http
              containerPort: {{ .Values.containerPort }}
          # /healthz는 FAULT_RATE의 영향을 받지 않는다. 결함을 주입해도 파드는
          # 계속 Ready여야 카나리 분석이 롤백을 판단할 수 있다.
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
