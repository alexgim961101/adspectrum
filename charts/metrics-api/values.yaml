# 실제 값은 deploy/values/metrics-api.yaml이 덮어쓴다.

replicaCount: 2

image:
  repository: ""
  tag: ""
  pullPolicy: IfNotPresent

serviceAccount:
  name: metrics-api
  roleArn: ""

env:
  TABLE_NAME: ""
  AWS_REGION: ap-northeast-2
  # 카나리 자동 롤백 데모 전용 장치. 평소에는 0이어야 한다.
  FAULT_RATE: "0"

service:
  port: 80

# API 포트가 지표 포트를 겸한다. /metrics를 같은 서버에 마운트했다.
containerPort: 8000

metrics:
  interval: 15s

# 카나리 단계마다 카나리 파드의 5xx 비율을 Prometheus에 물어본다.
analysis:
  prometheusAddress: http://kube-prometheus-stack-prometheus.monitoring:9090
  # 카나리 파드가 뜨자마자 물어보면 아직 스크레이프된 지표가 없다. 그 구간을
  # 건너뛰지 않으면 "데이터 없음"이 "정상"으로 계산되어 결함이 통과한다
  # (DECISIONS 013). 스크레이프 간격 15s 기준 두 점이 쌓일 시간을 준다.
  initialDelay: 45s
  # 20초 간격 3회 = 약 1분. 단계당 대기 시간은 initialDelay + 이 값이다.
  interval: 20s
  count: 3
  # 5%를 넘으면 그 측정은 실패다.
  maxErrorRate: 0.05

ingress:
  enabled: true
  # 도메인이 없으므로 ALB 기본 DNS + HTTP로 노출한다 (SPEC 12장).
  className: alb
  groupName: adspectrum

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    memory: 256Mi
