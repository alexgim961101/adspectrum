# 실제 값은 deploy/values/ad-event-generator.yaml이 덮어쓴다.
# 여기 있는 값은 helm template으로 차트를 단독 검증할 때 쓰는 기본값이다.

replicaCount: 1

image:
  repository: ""
  # 태그 기본값을 두지 않는다. latest로 조용히 배포되는 것을 막고,
  # CI가 갱신을 빠뜨리면 동기화 단계에서 바로 실패하게 한다.
  tag: ""
  pullPolicy: IfNotPresent

serviceAccount:
  name: ad-event-generator
  roleArn: ""

env:
  QUEUE_URL: ""
  EVENTS_PER_SEC: "5"
  AWS_REGION: ap-northeast-2

metrics:
  port: 9090
  interval: 15s

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    # CPU limit은 두지 않는다. 스로틀링이 걸리면 초당 발행량이 조용히 떨어져
    # 부하 시나리오의 숫자가 거짓이 된다. 메모리만 막는다.
    memory: 128Mi
