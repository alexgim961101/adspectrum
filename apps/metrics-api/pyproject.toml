[project]
name = "metrics-api"
version = "0.1.0"
description = "집계된 캠페인 성과를 조회하는 API"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.121.0",
    "uvicorn[standard]>=0.40.0",
    "boto3>=1.40.0",
    "prometheus-client>=0.23.0",
]

[dependency-groups]
dev = [
    "pytest>=8.4.0",
    "ruff>=0.14.0",
    "httpx2>=0.29.0",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
