# 검사에서 제외하는 지적과 그 이유. 이유 없이 무시하지 않는다 — 목록이 길어지면
# 검사 자체가 무의미해지므로, 각 항목은 왜 지금 받아들이는지와 언제 다시 볼지를
# 함께 적는다.
misconfigurations:
  - id: AWS-0178
    paths:
      - "modules/network/main.tf"
    statement: >
      VPC 흐름 로그를 켜지 않는다. 이 클러스터는 작업하지 않는 시간에 destroy되고
      네트워크 포렌식을 수행할 주체가 없다. 로그 수집 비용은 상시 발생한다.
      프로덕션이라면 켠다.

  - id: AWS-0025
    paths:
      - "modules/data/main.tf"
    statement: >
      DynamoDB를 고객 관리 키(CMK)가 아닌 AWS 소유 키로 암호화한다. 저장 시
      암호화는 이미 적용되어 있고, CMK는 키당 월 요금과 키 수명주기 관리가
      따라온다. 규제 요구가 생기면 바꾼다.

  - id: AWS-0033
    paths:
      - "modules/data/main.tf"
    statement: >
      ECR도 같은 이유로 AWS 소유 키를 쓴다. 이미지는 커밋에서 다시 만들 수 있는
      산출물이라 키를 직접 쥐어야 할 이유가 약하다.
