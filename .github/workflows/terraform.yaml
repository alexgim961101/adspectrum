# infra/ 변경을 검사한다. apps/·charts/를 검사하는 ci.yaml과 파일을 나눈 이유는
# 트리거 경로도 검사 내용도 겹치지 않고, 공유할 변경 감지 로직도 없기 때문이다
# (ci.yaml을 한 파일로 둔 이유는 DECISIONS 011에 있다).
name: terraform

on:
  push:
    branches: [main]
    paths:
      - "infra/**"
      - ".github/workflows/terraform.yaml"
  pull_request:
    paths:
      - "infra/**"
      - ".github/workflows/terraform.yaml"

permissions:
  contents: read

# plan은 상태 잠금을 잡는다. 실행 중에 취소하면 잠금이 남아 다음 실행이 막히므로
# 겹칠 때 앞 실행을 죽이지 않고 기다린다.
concurrency:
  group: terraform-${{ github.ref }}
  cancel-in-progress: false

env:
  TF_VERSION: "1.9.5"
  TRIVY_VERSION: "0.74.0"
  AWS_REGION: ap-northeast-2

jobs:
  # AWS를 건드리지 않는 검사. 자격증명 없이 돌기 때문에 포크 PR에서도 실행된다.
  check:
    name: 정적 검사
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: fmt
        run: terraform fmt -check -recursive infra

      # 백엔드 없이 초기화한다. validate는 상태가 필요 없고, 여기서 상태에
      # 접근하면 자격증명 없이 도는 이 잡의 전제가 깨진다.
      - name: validate
        run: |
          for dir in infra/envs/dev infra/modules/*/; do
            echo "::group::$dir"
            terraform -chdir="$dir" init -backend=false -input=false >/dev/null
            terraform -chdir="$dir" validate
            echo "::endgroup::"
          done

      - uses: terraform-linters/setup-tflint@v4
        with:
          tflint_version: v0.53.0

      - name: tflint
        # 플러그인을 GitHub 릴리스에서 받아온다. 토큰이 없으면 비인증 한도에 걸린다.
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          tflint --init
          tflint --recursive --format compact

      # IaC 오설정 검사. 이미지 스캔에도 같은 도구를 쓸 수 있어 도구 수를 늘리지 않는다.
      #
      # 마켓플레이스 액션 대신 바이너리를 직접 받는다. 로컬에서 돌리는 것과 CI가
      # 같은 버전을 쓰게 되고, 의존하는 서드파티 액션이 하나 줄어든다.
      - name: trivy 설치
        run: |
          curl -sSL "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz" \
            | sudo tar -xz -C /usr/local/bin trivy
          trivy --version | head -1

      - name: trivy config
        run: trivy config infra --config .trivy.yaml --severity MEDIUM,HIGH,CRITICAL --exit-code 1

  # 실제로 무엇이 바뀌는지 본다. 읽기 전용 역할을 쓰고 상태에 쓰지 않는다.
  plan:
    name: plan
    needs: check
    # 포크에서 온 PR에는 OIDC 토큰이 발급되지 않는다. 조건 없이 두면 매번
    # 실패한 잡이 남아 신호가 무뎌진다.
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v5

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      # 이 역할은 destroy되는 환경 밖에 있다. 환경이 내려가 있을 때야말로
      # plan이 "무엇이 생길지"를 보여줘야 하는데, 역할이 환경 안에 있으면
      # 그 순간 자기도 함께 사라진다 (DECISIONS 015).
      - uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: arn:aws:iam::894759291324:role/adspectrum-ci-plan
          aws-region: ${{ env.AWS_REGION }}

      - name: init
        run: terraform -chdir=infra/envs/dev init -input=false

      # 예산 알림 이메일은 저장소에 없다. plan에만 쓰는 자리표시자를 넣는다.
      - name: plan
        id: plan
        run: |
          set -o pipefail
          terraform -chdir=infra/envs/dev plan -input=false -no-color -lock-timeout=120s \
            -var 'budget_notification_email=ci@example.com' | tee plan.txt

      - name: PR에 결과 남기기
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          summary=$(grep -E '^(Plan:|No changes\.)' plan.txt | tail -1)
          {
            echo "### terraform plan"
            echo
            echo "\`${summary:-요약 줄을 찾지 못했다}\`"
            echo
            echo '<details><summary>전체 출력</summary>'
            echo
            echo '```terraform'
            # 코멘트 길이 상한(65536자)에 걸리면 잘라 낸다.
            head -c 55000 plan.txt
            echo '```'
            echo '</details>'
          } > comment.md
          gh pr comment "${{ github.event.pull_request.number }}" --body-file comment.md
