# push(main)와 pull_request를 한 파일에서 처리한다. 변경 감지 로직이 양쪽에 똑같이
# 필요한데 파일을 나누면 그 로직이 두 벌이 되고, 한쪽만 고치는 사고가 난다.
# AWS를 건드리는 단계만 push에서 실행한다 — IAM 역할의 신뢰 정책이 refs/heads/main으로
# 잠겨 있어서 PR에서는 애초에 역할을 맡을 수 없다.
name: ci

on:
  push:
    branches: [main]
    # deploy/**가 빠져 있다. 이 워크플로가 마지막에 deploy/values를 갱신하고
    # 되미는데, 그 커밋이 다시 워크플로를 부르면 무한 루프가 된다.
    paths:
      - "apps/**"
      - "charts/**"
      - ".github/workflows/ci.yaml"
  pull_request:
    paths:
      - "apps/**"
      - "charts/**"
      - ".github/workflows/ci.yaml"

# 태그 갱신 커밋을 main에 되밀기 때문에 두 실행이 겹치면 푸시가 충돌한다.
# 취소하지는 않는다 — 이미 ECR에 올라간 이미지의 태그가 반영되지 않은 채 남는다.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  AWS_REGION: ap-northeast-2
  REGISTRY: 894759291324.dkr.ecr.ap-northeast-2.amazonaws.com
  UV_VERSION: "0.10.7"

jobs:
  detect:
    name: 변경 감지
    runs-on: ubuntu-latest
    outputs:
      apps: ${{ steps.scan.outputs.apps }}
      charts: ${{ steps.scan.outputs.charts }}
      tag: ${{ steps.scan.outputs.tag }}
    steps:
      - uses: actions/checkout@v5
        with:
          # 비교 대상 커밋이 얕은 클론에 없을 수 있다.
          fetch-depth: 0

      - id: scan
        name: 바뀐 앱과 차트 추리기
        env:
          BEFORE: ${{ github.event.before }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="$PR_BASE"
          else
            base="$BEFORE"
          fi
          # 브랜치 첫 푸시에서는 before가 0으로 채워져 온다.
          if [ -z "$base" ] || ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
            base=$(git rev-parse HEAD~1)
          fi
          changed=$(git diff --name-only "$base" "${{ github.sha }}")
          echo "비교 기준: $base"
          echo "$changed"

          apps='[]'
          charts='[]'
          for app in ad-event-generator event-consumer metrics-api; do
            # 차트만 바뀌면 이미지를 다시 구울 이유가 없다. ArgoCD가 Git에서
            # 차트 변경을 직접 받아 간다. 그래서 목록을 따로 만든다.
            if grep -q "^apps/${app}/" <<< "$changed"; then
              apps=$(jq -c --arg a "$app" '. + [$a]' <<< "$apps")
            fi
            if grep -q "^charts/${app}/" <<< "$changed"; then
              charts=$(jq -c --arg a "$app" '. + [$a]' <<< "$charts")
            fi
          done

          {
            echo "apps=$apps"
            echo "charts=$charts"
            echo "tag=${GITHUB_SHA::7}"
          } >> "$GITHUB_OUTPUT"

  verify:
    name: 검사 (${{ matrix.app }})
    needs: detect
    if: needs.detect.outputs.apps != '[]'
    runs-on: ubuntu-latest
    strategy:
      # 한 앱이 실패해도 나머지 결과를 다 보고 싶다.
      fail-fast: false
      matrix:
        app: ${{ fromJson(needs.detect.outputs.apps) }}
    defaults:
      run:
        working-directory: apps/${{ matrix.app }}
    steps:
      - uses: actions/checkout@v5

      - name: uv 설치
        # Dockerfile과 같은 버전을 고정한다. 로컬·CI·이미지에서 같은 해석 결과를 쓴다.
        run: |
          curl -LsSf "https://astral.sh/uv/${UV_VERSION}/install.sh" | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
        working-directory: .

      - name: 의존성 설치
        # --frozen: uv.lock을 갱신하지 않는다. 락이 낡았으면 여기서 실패해야 한다.
        run: uv sync --frozen

      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest -q

  charts:
    name: 차트 검증
    needs: detect
    if: needs.detect.outputs.charts != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        chart: ${{ fromJson(needs.detect.outputs.charts) }}
    steps:
      - uses: actions/checkout@v5

      - uses: azure/setup-helm@v4
        with:
          version: v4.2.1

      - name: lint과 렌더링
        # 실제 values를 얹어 렌더링해야 의미가 있다. 태그는 아직 갱신 전이라
        # 비어 있을 수 있으므로 여기서만 임시 값을 넣는다.
        run: |
          helm lint "charts/${{ matrix.chart }}" \
            --values "deploy/values/${{ matrix.chart }}.yaml" --set image.tag=ci
          helm template "${{ matrix.chart }}" "charts/${{ matrix.chart }}" \
            --namespace adspectrum \
            --values "deploy/values/${{ matrix.chart }}.yaml" --set image.tag=ci > /dev/null

  publish:
    name: 이미지 푸시 (${{ matrix.app }})
    needs: [detect, verify]
    if: github.event_name == 'push' && needs.detect.outputs.apps != '[]'
    runs-on: ubuntu-latest
    permissions:
      # OIDC 토큰 발급. 장기 액세스 키를 저장소에 두지 않는 핵심 장치다.
      id-token: write
      contents: read
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJson(needs.detect.outputs.apps) }}
    steps:
      - uses: actions/checkout@v5

      - uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: arn:aws:iam::894759291324:role/adspectrum-github-actions
          aws-region: ${{ env.AWS_REGION }}

      - name: 이미 올라간 태그인지 확인
        id: exists
        # ECR이 태그 불변이라 같은 태그 재푸시는 실패한다. 워크플로를 다시 돌리는
        # 경우(재실행)에 여기서 걸러 낸다.
        run: |
          if aws ecr describe-images \
               --repository-name "adspectrum/${{ matrix.app }}" \
               --image-ids "imageTag=${{ needs.detect.outputs.tag }}" >/dev/null 2>&1; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi

      - name: ECR 로그인
        if: steps.exists.outputs.found == 'false'
        run: |
          aws ecr get-login-password --region "$AWS_REGION" \
            | docker login --username AWS --password-stdin "$REGISTRY"

      - name: 빌드와 푸시
        if: steps.exists.outputs.found == 'false'
        # 러너가 x86이라 --platform 없이도 amd64가 나오지만 명시한다. 로컬(arm64)에서
        # 같은 명령을 그대로 쓸 수 있어야 RUNBOOK과 CI가 갈라지지 않는다 (DECISIONS 008).
        run: |
          docker buildx build --platform linux/amd64 \
            --tag "$REGISTRY/adspectrum/${{ matrix.app }}:${{ needs.detect.outputs.tag }}" \
            --push "apps/${{ matrix.app }}"

  update-tags:
    name: 배포 태그 갱신
    needs: [detect, publish]
    if: github.event_name == 'push' && needs.detect.outputs.apps != '[]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main

      - name: values의 이미지 태그 갱신
        env:
          TAG: ${{ needs.detect.outputs.tag }}
          APPS: ${{ needs.detect.outputs.apps }}
        run: |
          set -euo pipefail
          for app in $(jq -r '.[]' <<< "$APPS"); do
            yq -i '.image.tag = strenv(TAG)' "deploy/values/${app}.yaml"
          done

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet; then
            echo "이미 같은 태그다. 커밋할 것이 없다."
            exit 0
          fi
          # [skip ci]는 2차 방어선이다. 1차는 트리거의 paths에 deploy/**가 없는 것,
          # 3차는 GITHUB_TOKEN으로 만든 푸시가 워크플로를 다시 부르지 않는 GitHub 규칙이다.
          git commit -am "chore(deploy): 이미지 태그 ${TAG} 반영 [skip ci]"
          git pull --rebase --autostash
          git push
