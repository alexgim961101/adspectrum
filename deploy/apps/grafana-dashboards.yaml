# 대시보드 정의를 Git에서 클러스터로 나른다. Helm 차트가 아니라 평범한 매니페스트
# 디렉터리라, ArgoCD가 deploy/dashboards의 YAML을 그대로 적용한다.
#
# 대시보드를 Grafana UI에서 만들지 않는 이유: Grafana에 볼륨을 붙이지 않아서
# 파드가 재시작되면 손으로 만든 것은 사라진다. 클러스터를 통째로 지웠다 올려도
# 같은 화면이 나와야 한다 (성공 기준 1).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: grafana-dashboards
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default

  source:
    repoURL: git@github.com:alexgim961101/adspectrum.git
    targetRevision: main
    path: deploy/dashboards

  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      # kube-prometheus-stack보다 먼저 동기화될 수 있다. 네임스페이스가 없다고
      # 실패한 뒤 재시도로 회복하는 것보다, 만들고 시작하는 편이 조용하다.
      - CreateNamespace=true
    retry:
      limit: 5
      backoff:
        duration: 15s
        factor: 2
        maxDuration: 5m
