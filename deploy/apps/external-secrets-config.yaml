# ClusterSecretStore와 ExternalSecret. 둘 다 external-secrets 차트가 설치하는
# CRD를 필요로 하므로 뒤 물결에서 동기화한다. 앞 물결(0)의 앱들이 Healthy가 된
# 뒤에 적용되므로 CRD도 monitoring 네임스페이스도 이미 존재한다.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: external-secrets-config
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default

  source:
    repoURL: git@github.com:alexgim961101/adspectrum.git
    targetRevision: main
    path: deploy/secrets

  destination:
    server: https://kubernetes.default.svc
    namespace: external-secrets

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      limit: 5
      backoff:
        duration: 15s
        factor: 2
        maxDuration: 5m
