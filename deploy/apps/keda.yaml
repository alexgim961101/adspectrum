# SQS 큐 길이를 보고 consumer 레플리카를 조절한다.
# ScaledObject는 charts/event-consumer/templates/scaledobject.yaml에 있다.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: keda
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default

  source:
    repoURL: https://kedacore.github.io/charts
    chart: keda
    targetRevision: 2.20.2
    helm:
      values: |
        serviceAccount:
          operator:
            create: true
            name: keda-operator
            # 큐 길이 조회 권한은 파드가 아니라 오퍼레이터가 갖는다.
            # ScaledObject에서 identityOwner를 operator로 지정해 이 권한을 쓴다.
            annotations:
              eks.amazonaws.com/role-arn: arn:aws:iam::894759291324:role/adspectrum-keda-operator

        # 스케일러가 읽은 큐 길이를 Prometheus로 내보낸다. 대시보드의 핵심 패널이
        # CloudWatch가 아니라 이 값을 쓴다 — 해상도가 높고, 무엇보다 KEDA가 실제
        # 스케일 판단에 쓴 값 그대로라 "왜 이때 늘었나"를 그래프로 설명할 수 있다.
        prometheus:
          operator:
            enabled: true
            podMonitor:
              enabled: true
              interval: 15s

        resources:
          operator:
            requests:
              cpu: 50m
              memory: 96Mi
          metricServer:
            requests:
              cpu: 50m
              memory: 96Mi

  destination:
    server: https://kubernetes.default.svc
    namespace: keda

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    # 일시적 실패(웹훅 미기동, CRD 준비 전 등)에서 스스로 회복하도록 재시도한다.
    # 없으면 한 번 실패한 뒤 OutOfSync 상태로 멈춰 사람이 개입해야 한다.
    retry:
      limit: 5
      backoff:
        duration: 15s
        factor: 2
        maxDuration: 5m
