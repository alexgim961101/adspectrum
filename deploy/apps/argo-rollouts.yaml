# Deployment 대신 Rollout 리소스로 카나리 배포를 수행한다.
# 6일차 metrics-api의 단계적 배포와 자동 롤백이 이 컨트롤러의 기능이다.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: argo-rollouts
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default

  source:
    repoURL: https://argoproj.github.io/argo-helm
    chart: argo-rollouts
    targetRevision: 2.41.1
    helm:
      values: |
        controller:
          resources:
            requests:
              cpu: 50m
              memory: 96Mi

        # 대시보드는 진행 상황을 kubectl 플러그인으로 확인하므로 띄우지 않는다.
        dashboard:
          enabled: false

  destination:
    server: https://kubernetes.default.svc
    namespace: argo-rollouts

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
