# Deployment 대신 Rollout 리소스로 카나리 배포를 수행한다.
# metrics-api의 단계적 배포와 자동 롤백이 이 컨트롤러의 기능이다.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: argo-rollouts
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default

  source:
    repoURL: https://argoproj.github.io/argo-helm
    chart: argo-rollouts
    targetRevision: 2.41.1
    helm:
      values: |
        controller:
          resources:
            requests:
              cpu: 50m
              memory: 96Mi

        # 대시보드는 진행 상황을 kubectl 플러그인으로 확인하므로 띄우지 않는다.
        dashboard:
          enabled: false

  destination:
    server: https://kubernetes.default.svc
    namespace: argo-rollouts

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    # 일시적 실패(웹훅 미기동, CRD 준비 전 등)에서 스스로 회복하도록 재시도한다.
    # 없으면 한 번 실패한 뒤 OutOfSync 상태로 멈춰 사람이 개입해야 한다.
    retry:
      limit: 5
      backoff:
        duration: 15s
        factor: 2
        maxDuration: 5m
