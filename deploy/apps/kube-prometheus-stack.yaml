# Prometheus, Grafana, kube-state-metrics를 한 번에 올린다.
#
# Application 이름을 바꾸면 안 된다. ArgoCD가 Application 이름을 Helm 릴리스
# 이름으로 쓰고, Grafana ServiceAccount 이름이 여기서 파생된다
# (kube-prometheus-stack-grafana). IRSA 신뢰 정책이 그 이름을 고정하고 있다.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kube-prometheus-stack
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default

  source:
    repoURL: https://prometheus-community.github.io/helm-charts
    chart: kube-prometheus-stack
    targetRevision: 88.5.3
    helm:
      values: |
        # 감지만 하고 통보하지 않으면 사람이 대시보드를 보고 있어야만 장애를 안다.
        # 규칙은 각 앱 차트의 PrometheusRule에 있다.
        alertmanager:
          enabled: true

          alertmanagerSpec:
            resources:
              requests:
                cpu: 20m
                memory: 64Mi
              limits:
                memory: 128Mi

            # 웹훅 URL은 비밀이라 Git에 넣지 않는다. 부트스트랩에서 사람이 주입한
            # 시크릿을 파일로 마운트하고, 설정은 그 파일을 가리킨다
            # (RUNBOOK 4b, DECISIONS 016).
            secrets:
              - adspectrum-alertmanager-slack

          config:
            global:
              slack_api_url_file: /etc/alertmanager/secrets/adspectrum-alertmanager-slack/webhook-url

            route:
              # 같은 알림이 여러 파드에서 동시에 뜨면 한 건으로 묶는다.
              group_by: [alertname, namespace]
              group_wait: 30s
              group_interval: 5m
              # 해결되지 않은 알림을 4시간마다 다시 알린다. 더 짧으면 소음이 되고
              # 더 길면 잊힌다.
              repeat_interval: 4h
              receiver: slack

              routes:
                # Watchdog은 항상 발화하는 감시용 알림이다. 알림 파이프라인이
                # 살아 있는지 외부에서 확인하는 용도라, 채널로 보내면 소음만 된다.
                # 실제 운영이라면 dead man's switch 서비스로 보낸다.
                - matchers: [alertname = "Watchdog"]
                  receiver: "null"
                  continue: false

                - matchers: [severity = "critical"]
                  receiver: slack
                  repeat_interval: 1h

            receivers:
              - name: "null"
              - name: slack
                slack_configs:
                  # Alertmanager가 이 필드를 요구하지만, 최신 방식(Slack 앱)으로 만든
                  # 수신 웹훅은 생성 시점에 채널이 고정되어 이 값을 무시한다.
                  # 채널을 바꾸려면 웹훅을 다시 발급한다.
                  - channel: "#adspectrum-alerts"
                    send_resolved: true
                    # Go 템플릿을 그대로 적는다. 이 값은 차트가 tpl로 렌더링하지
                    # 않으므로 Helm 이스케이프({{ "..." }})를 쓰면 템플릿 문자열
                    # 자체가 메시지로 나간다. 줄바꿈도 \n이 아니라 실제 개행이어야
                    # Slack에서 줄이 나뉜다.
                    title: '{{ .CommonLabels.severity | toUpper }} · {{ .CommonLabels.alertname }}'
                    text: |-
                      {{ range .Alerts }}{{ .Annotations.summary }}
                      {{ .Annotations.description }}
                      {{ end }}

            inhibit_rules:
              # 같은 대상에 critical이 떠 있으면 warning은 묻는다.
              - source_matchers: [severity = "critical"]
                target_matchers: [severity = "warning"]
                equal: [alertname, namespace]

        # 관리형 컨트롤플레인에서는 이 컴포넌트들을 긁을 수 없다. 기본 규칙을 켜 두면
        # "스케줄러가 죽었다"는 알림이 영원히 발화해 채널을 덮는다. 울릴 수 없는
        # 알림을 켜 두면 사람은 채널 전체를 무시하게 된다.
        defaultRules:
          rules:
            etcd: false
            kubeControllerManager: false
            kubeScheduler: false
            kubeSchedulerAlerting: false
            kubeSchedulerRecording: false
            kubeProxy: false

        prometheus:
          prometheusSpec:
            # 기본값은 릴리스 라벨이 붙은 대상만 수집한다. false로 두어야
            # 애플리케이션이 만드는 PodMonitor를 발견한다.
            podMonitorSelectorNilUsesHelmValues: false
            serviceMonitorSelectorNilUsesHelmValues: false
            ruleSelectorNilUsesHelmValues: false

            # 데모용이라 짧게 유지한다. EBS CSI 드라이버를 설치하지 않았으므로
            # 볼륨을 요구하면 파드가 Pending에 걸린다. storageSpec을 비워 두면
            # emptyDir을 쓰고, 파드가 재시작되면 지표가 사라진다.
            retention: 6h
            retentionSize: 2GB

            resources:
              requests:
                cpu: 100m
                memory: 512Mi
              limits:
                memory: 1Gi

        prometheusOperator:
          resources:
            requests:
              cpu: 50m
              memory: 96Mi

        kube-state-metrics:
          # consumer 레플리카 수 패널이 이 컴포넌트의 지표를 쓴다.
          resources:
            requests:
              cpu: 20m
              memory: 64Mi

        grafana:
          serviceAccount:
            create: true
            annotations:
              eks.amazonaws.com/role-arn: arn:aws:iam::894759291324:role/adspectrum-grafana

          # 대시보드는 코드로 정의해 다시 만들 수 있으므로 볼륨을 쓰지 않는다.
          persistence:
            enabled: false

          additionalDataSources:
            # SQS 큐 깊이는 Prometheus가 아니라 CloudWatch에만 있다.
            # authType default는 IRSA가 주입한 웹 아이덴티티 토큰을 사용한다.
            - name: CloudWatch
              type: cloudwatch
              # 대시보드가 이 uid로 데이터소스를 찾는다. 지정하지 않으면 Grafana가
              # 임의의 uid를 만들어, 코드로 둔 대시보드가 데이터소스를 잃는다.
              uid: cloudwatch
              jsonData:
                authType: default
                defaultRegion: ap-northeast-2

          resources:
            requests:
              cpu: 50m
              memory: 128Mi

  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      # CRD가 매우 커서 이 옵션 없이는 어노테이션 크기 제한에 걸린다.
      - ServerSideApply=true
    # 일시적 실패(웹훅 미기동, CRD 준비 전 등)에서 스스로 회복하도록 재시도한다.
    # 없으면 한 번 실패한 뒤 OutOfSync 상태로 멈춰 사람이 개입해야 한다.
    retry:
      limit: 5
      backoff:
        duration: 15s
        factor: 2
        maxDuration: 5m
