# Prometheus, Grafana, kube-state-metrics를 한 번에 올린다.
#
# Application 이름을 바꾸면 안 된다. ArgoCD가 Application 이름을 Helm 릴리스
# 이름으로 쓰고, Grafana ServiceAccount 이름이 여기서 파생된다
# (kube-prometheus-stack-grafana). IRSA 신뢰 정책이 그 이름을 고정하고 있다.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kube-prometheus-stack
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default

  source:
    repoURL: https://prometheus-community.github.io/helm-charts
    chart: kube-prometheus-stack
    targetRevision: 88.5.3
    helm:
      values: |
        # 알림 발송은 이 프로젝트의 완료 조건에 없다. 파드와 메모리를 아낀다.
        alertmanager:
          enabled: false

        prometheus:
          prometheusSpec:
            # 기본값은 릴리스 라벨이 붙은 대상만 수집한다. false로 두어야
            # 3일차에 애플리케이션이 만드는 PodMonitor를 발견한다.
            podMonitorSelectorNilUsesHelmValues: false
            serviceMonitorSelectorNilUsesHelmValues: false
            ruleSelectorNilUsesHelmValues: false

            # 데모용이라 짧게 유지한다. EBS CSI 드라이버를 설치하지 않았으므로
            # 볼륨을 요구하면 파드가 Pending에 걸린다. storageSpec을 비워 두면
            # emptyDir을 쓰고, 파드가 재시작되면 지표가 사라진다.
            retention: 6h
            retentionSize: 2GB

            resources:
              requests:
                cpu: 100m
                memory: 512Mi
              limits:
                memory: 1Gi

        prometheusOperator:
          resources:
            requests:
              cpu: 50m
              memory: 96Mi

        kube-state-metrics:
          # consumer 레플리카 수 패널이 이 컴포넌트의 지표를 쓴다.
          resources:
            requests:
              cpu: 20m
              memory: 64Mi

        grafana:
          serviceAccount:
            create: true
            annotations:
              eks.amazonaws.com/role-arn: arn:aws:iam::894759291324:role/adspectrum-grafana

          # 대시보드는 코드로 정의해 다시 만들 수 있으므로 볼륨을 쓰지 않는다.
          persistence:
            enabled: false

          sidecar:
            datasources:
              # alertmanager를 껐으므로 그 데이터소스도 만들지 않는다.
              # 그대로 두면 존재하지 않는 주소를 가리켜 Grafana에서 오류로 보인다.
              alertmanager:
                enabled: false

          additionalDataSources:
            # SQS 큐 깊이는 Prometheus가 아니라 CloudWatch에만 있다.
            # authType default는 IRSA가 주입한 웹 아이덴티티 토큰을 사용한다.
            - name: CloudWatch
              type: cloudwatch
              jsonData:
                authType: default
                defaultRegion: ap-northeast-2

          resources:
            requests:
              cpu: 50m
              memory: 128Mi

  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      # CRD가 매우 커서 이 옵션 없이는 어노테이션 크기 제한에 걸린다.
      - ServerSideApply=true
    # 일시적 실패(웹훅 미기동, CRD 준비 전 등)에서 스스로 회복하도록 재시도한다.
    # 없으면 한 번 실패한 뒤 OutOfSync 상태로 멈춰 사람이 개입해야 한다.
    retry:
      limit: 5
      backoff:
        duration: 15s
        factor: 2
        maxDuration: 5m
