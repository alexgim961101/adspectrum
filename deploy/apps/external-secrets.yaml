# 클러스터 밖 비밀 저장소(SSM 파라미터 스토어)의 값을 k8s Secret으로 동기화한다.
# 사람이 부트스트랩에서 주입하던 자리를 대신한다 (DECISIONS 017).
#
# 저장소(ClusterSecretStore)와 무엇을 당겨올지(ExternalSecret)는 deploy/secrets에
# 있고, CRD가 먼저 있어야 하므로 그쪽 Application이 뒤 물결에서 동기화된다.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: external-secrets
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default

  source:
    repoURL: https://charts.external-secrets.io
    chart: external-secrets
    targetRevision: 2.10.0
    helm:
      values: |
        # ServiceAccount 이름을 고정한다. 기본값은 <릴리스>-external-secrets라
        # 릴리스 이름이 바뀌면 IRSA 신뢰 정책과 어긋나 조용히 권한이 끊긴다.
        serviceAccount:
          name: external-secrets
          annotations:
            eks.amazonaws.com/role-arn: arn:aws:iam::894759291324:role/adspectrum-external-secrets

        resources:
          requests:
            cpu: 20m
            memory: 64Mi
          limits:
            memory: 128Mi

        webhook:
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 64Mi

        certController:
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 64Mi

  destination:
    server: https://kubernetes.default.svc
    namespace: external-secrets

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      # CRD가 커서 이 옵션 없이는 어노테이션 크기 제한에 걸린다.
      - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration: 15s
        factor: 2
        maxDuration: 5m
