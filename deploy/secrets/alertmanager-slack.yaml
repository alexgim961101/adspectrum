# Alertmanager가 마운트하는 시크릿을 SSM에서 만들어 준다.
#
# 값이 바뀌면 refreshInterval마다 다시 당겨 온다. 목적지를 바꾸려면 SSM 값만
# 고치면 되고 클러스터를 만질 일이 없다. 파라미터가 아직 없으면 이 리소스는
# SecretSyncedError 상태로 남고, 값을 넣는 순간 스스로 회복한다.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: alertmanager-slack
  namespace: monitoring
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-ssm
    kind: ClusterSecretStore
  target:
    name: adspectrum-alertmanager-slack
    creationPolicy: Owner
  data:
    - secretKey: webhook-url
      remoteRef:
        key: /adspectrum/alertmanager/slack-webhook
