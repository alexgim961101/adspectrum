# ArgoCD 자체는 ArgoCD가 관리하지 않는다. 자기 자신을 동기화하다 실패하면
# 복구 수단까지 함께 사라지므로, 부트스트랩 스크립트로만 설치·갱신한다.

global:
  # 노드 2대에 플랫폼 컴포넌트가 모두 올라가므로 요청량을 명시해 둔다.
  # 값을 비워 두면 스케줄러가 자리를 예측하지 못한다.
  resources:
    requests:
      cpu: 50m
      memory: 64Mi

# 외부 인증(SSO)을 쓰지 않는다. 파드 하나를 줄인다.
dex:
  enabled: false

# 알림과 ApplicationSet은 이 프로젝트 범위 밖이다.
notifications:
  enabled: false
applicationSet:
  enabled: false

controller:
  resources:
    requests:
      cpu: 100m
      memory: 256Mi

repoServer:
  resources:
    requests:
      cpu: 50m
      memory: 192Mi

server:
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
  # 외부 노출 없이 port-forward로만 접근한다. ALB를 띄우지 않아
  # 비용과 공격 표면을 모두 줄인다.
  service:
    type: ClusterIP

redis:
  resources:
    requests:
      cpu: 50m
      memory: 64Mi

configs:
  params:
    # port-forward로 접근하므로 TLS 종단을 서버에서 하지 않는다.
    # 외부에 노출한다면 이 설정을 되돌리고 인증서를 붙여야 한다.
    server.insecure: true
