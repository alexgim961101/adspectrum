# app-of-apps의 뿌리. 이 Application 하나가 deploy/apps/ 아래의 모든 Application을
# 관리하고, 그 Application들이 실제 컴포넌트를 관리한다.
# 새 컴포넌트를 추가하려면 deploy/apps/에 파일을 하나 두고 커밋하면 된다.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: root
  namespace: argocd
  finalizers:
    # Application을 지우면 그것이 만든 리소스도 함께 지운다.
    # 없으면 Application만 사라지고 실제 리소스가 클러스터에 남는다.
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default

  source:
    repoURL: https://github.com/alexgim961101/adspectrum.git
    targetRevision: main
    path: deploy/apps

  destination:
    server: https://kubernetes.default.svc
    namespace: argocd

  syncPolicy:
    automated:
      # Git에서 사라진 리소스를 클러스터에서도 지운다.
      prune: true
      # 누군가 클러스터를 직접 수정하면 Git 상태로 되돌린다.
      selfHeal: true
    retry:
      limit: 5
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
