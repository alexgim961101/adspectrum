# ArgoCD가 charts/ad-event-generator에 이 값을 얹어 배포한다.
# image.tag는 CI가 갱신한다 (4일차). 손으로 고치면 다음 CI 실행이 덮어쓴다.
image:
  repository: 894759291324.dkr.ecr.ap-northeast-2.amazonaws.com/adspectrum/ad-event-generator
  tag: "6725cb1"
serviceAccount:
  name: ad-event-generator
  roleArn: arn:aws:iam::894759291324:role/adspectrum-ad-event-generator
env:
  QUEUE_URL: https://sqs.ap-northeast-2.amazonaws.com/894759291324/adspectrum-events
  # 5일차 부하 시나리오에서 이 값을 300으로 올리는 커밋이 곧 부하 주입이다.
  EVENTS_PER_SEC: "5"
  AWS_REGION: ap-northeast-2
