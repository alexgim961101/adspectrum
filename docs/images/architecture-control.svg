<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 440" width="940" height="440"
     role="img" aria-label="자동 제어: 큐 길이가 레플리카 수를, 카나리 에러율이 배포 진행 여부를 결정한다" font-family="-apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Noto Sans KR', 'Malgun Gothic', sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
    <marker id="ad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="940" height="440" rx="10" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="28" y="40" font-size="14" fill="#0f172a" font-weight="700">자동 제어</text>
  <text x="28" y="60" font-size="11.5" fill="#475569">관측한 값이 곧 결정이 된다 · 사람이 개입하는 화살표는 없다</text>
  <text x="30" y="112" font-size="11.5" fill="#475569" font-weight="600">① 큐 길이 → 레플리카 수</text>
  <rect x="30" y="128" width="170" height="56" rx="8" fill="#fff7ed" stroke="#c2410c" stroke-width="1.5"/>
  <text x="115.0" y="161" text-anchor="middle" font-size="13" fill="#0f172a" font-weight="600">SQS 큐 길이</text>
  <rect x="330" y="128" width="150" height="56" rx="8" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.5"/>
  <text x="405.0" y="161" text-anchor="middle" font-size="13" fill="#0f172a" font-weight="600">KEDA</text>
  <rect x="610" y="128" width="190" height="56" rx="8" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.5"/>
  <text x="705.0" y="161" text-anchor="middle" font-size="13" fill="#0f172a" font-weight="600">event-consumer</text>
  <polyline points="200,156 330,156" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="265" y="148" text-anchor="middle" font-size="11" fill="#475569">30초마다 폴링</text>
  <polyline points="480,156 610,156" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="545" y="141" text-anchor="middle" font-size="11" fill="#475569">replicas 0 ↔ 5</text>
  <text x="545" y="175" text-anchor="middle" font-size="11" fill="#475569">파드당 목표 100건</text>
  <polyline points="705,184 705,214 115,214 115,184" fill="none" stroke="#94a3b8" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#ad)"/>
  <text x="410" y="230" text-anchor="middle" font-size="11" fill="#475569">소비할수록 큐가 줄고, 비면 0으로 내려간다</text>
  <text x="30" y="290" font-size="11.5" fill="#475569" font-weight="600">② 카나리 에러율 → 배포 진행</text>
  <rect x="30" y="306" width="130" height="56" rx="8" fill="#fff7ed" stroke="#c2410c" stroke-width="1.5"/>
  <text x="95.0" y="339" text-anchor="middle" font-size="13" fill="#0f172a" font-weight="600">ALB</text>
  <rect x="250" y="306" width="200" height="56" rx="8" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.5"/>
  <text x="350.0" y="331" text-anchor="middle" font-size="13" fill="#0f172a" font-weight="600">metrics-api</text>
  <text x="350.0" y="347" text-anchor="middle" font-size="11" fill="#0f172a">안정 파드 · 카나리 파드</text>
  <rect x="540" y="306" width="160" height="56" rx="8" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.5"/>
  <text x="620.0" y="339" text-anchor="middle" font-size="13" fill="#0f172a" font-weight="600">Prometheus</text>
  <rect x="780" y="306" width="130" height="56" rx="8" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.5"/>
  <text x="845.0" y="339" text-anchor="middle" font-size="13" fill="#0f172a" font-weight="600">Argo Rollouts</text>
  <polyline points="160,334 250,334" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="205" y="326" text-anchor="middle" font-size="11" fill="#475569">가중치 분할</text>
  <polyline points="450,334 540,334" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="495" y="326" text-anchor="middle" font-size="11" fill="#475569">스크레이프</text>
  <polyline points="700,334 780,334" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="740" y="326" text-anchor="middle" font-size="11" fill="#475569">카나리 5xx 비율</text>
  <polyline points="845,362 845,396 95,396 95,362" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="470" y="412" text-anchor="middle" font-size="11" fill="#475569">20% → 50% → 100%, 5%를 넘으면 즉시 안정 버전 100%로 되돌린다</text>
</svg>
