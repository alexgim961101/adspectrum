  <text x="155.0" y="243" text-anchor="middle" font-size="11" fill="#0f172a">이벤트 시뮬레이터</text>
  <rect x="360" y="202" width="190" height="56" rx="8" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.5"/>
  <text x="455.0" y="227" text-anchor="middle" font-size="13" fill="#0f172a" font-weight="600">event-consumer</text>
  <text x="455.0" y="243" text-anchor="middle" font-size="11" fill="#0f172a">배치 내 사전 집계</text>
