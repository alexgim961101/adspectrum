  <polyline points="750,58 750,82" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#a)"/>
  <polyline points="750,126 750,202" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="738" y="150" text-anchor="end" font-size="11" fill="#475569">GET /campaigns/…/metrics</text>
  <polyline points="155,258 155,322 215,322 215,336" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="163" y="315" text-anchor="start" font-size="11" fill="#475569">SendMessageBatch 10건</text>
  <polyline points="295,336 295,308 455,308 455,258" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="303" y="301" text-anchor="start" font-size="11" fill="#475569">long poll 20초 · 배치 10건</text>
  <polyline points="505,258 505,316 700,316 700,336" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="513" y="309" text-anchor="start" font-size="11" fill="#475569">UpdateItem ADD</text>
  <polyline points="790,258 790,336" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="782" y="301" text-anchor="end" font-size="11" fill="#475569">버킷 Query 후 합산</text>
  <polyline points="325,365 430,365" fill="none" stroke="#94a3b8" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#ad)"/>
  <text x="377" y="357" text-anchor="middle" font-size="11" fill="#475569">수신 3회 초과</text>
