<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" width="900" height="420"
     role="img" aria-label="데이터 평면: generator가 SQS로 발행하고 consumer가 DynamoDB에 집계하며 metrics-api가 조회한다" font-family="-apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Noto Sans KR', 'Malgun Gothic', sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
    <marker id="ad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="900" height="420" rx="10" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="28" y="40" font-size="14" fill="#0f172a" font-weight="700">데이터 평면</text>
  <text x="28" y="60" font-size="11.5" fill="#475569">이벤트가 발행되어 집계되고 조회되기까지</text>
  <rect x="650" y="20" width="200" height="38" rx="19" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
  <text x="750.0" y="44" text-anchor="middle" font-size="13" fill="#0f172a" font-weight="600">조회 클라이언트</text>
  <rect x="650" y="82" width="200" height="44" rx="8" fill="#fff7ed" stroke="#c2410c" stroke-width="1.5"/>
  <text x="750.0" y="101" text-anchor="middle" font-size="13" fill="#0f172a" font-weight="600">ALB</text>
  <text x="750.0" y="117" text-anchor="middle" font-size="11" fill="#0f172a">퍼블릭 서브넷</text>
  <rect x="30" y="166" width="840" height="120" rx="12" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="6 4"/>
