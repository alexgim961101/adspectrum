<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 370" width="940" height="370"
     role="img" aria-label="배포 평면: push가 CI를 거쳐 ECR과 저장소를 갱신하고 ArgoCD가 클러스터에 반영한다" font-family="-apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Noto Sans KR', 'Malgun Gothic', sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
    <marker id="ad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="940" height="370" rx="10" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="28" y="40" font-size="14" fill="#0f172a" font-weight="700">배포 평면</text>
  <text x="28" y="60" font-size="11.5" fill="#475569">커밋 하나가 클러스터에 반영되기까지 · 클러스터를 직접 고치는 화살표는 없다</text>
  <rect x="30" y="112" width="120" height="38" rx="19" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
  <text x="90.0" y="136" text-anchor="middle" font-size="13" fill="#0f172a" font-weight="600">개발자</text>
  <rect x="200" y="100" width="180" height="62" rx="8" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
  <text x="290.0" y="128" text-anchor="middle" font-size="13" fill="#0f172a" font-weight="600">GitHub 모노레포</text>
  <text x="290.0" y="144" text-anchor="middle" font-size="11" fill="#0f172a">apps · charts · deploy</text>
  <rect x="500" y="100" width="210" height="62" rx="8" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
  <text x="605.0" y="128" text-anchor="middle" font-size="13" fill="#0f172a" font-weight="600">GitHub Actions</text>
  <text x="605.0" y="144" text-anchor="middle" font-size="11" fill="#0f172a">ruff · pytest · 빌드</text>
  <rect x="800" y="100" width="130" height="62" rx="8" fill="#fff7ed" stroke="#c2410c" stroke-width="1.5"/>
  <text x="865.0" y="136" text-anchor="middle" font-size="13" fill="#0f172a" font-weight="600">ECR</text>
  <rect x="200" y="258" width="180" height="62" rx="8" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.5"/>
  <text x="290.0" y="286" text-anchor="middle" font-size="13" fill="#0f172a" font-weight="600">ArgoCD</text>
  <text x="290.0" y="302" text-anchor="middle" font-size="11" fill="#0f172a">app-of-apps</text>
  <rect x="720" y="258" width="190" height="62" rx="8" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.5"/>
  <text x="815.0" y="286" text-anchor="middle" font-size="13" fill="#0f172a" font-weight="600">EKS 워크로드</text>
  <text x="815.0" y="302" text-anchor="middle" font-size="11" fill="#0f172a">앱 3종 · 플랫폼</text>
  <polyline points="150,131 200,131" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="175" y="123" text-anchor="middle" font-size="11" fill="#475569">push</text>
  <polyline points="380,131 500,131" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="440" y="123" text-anchor="middle" font-size="11" fill="#475569">apps/ · charts/ 변경 시</text>
  <polyline points="710,131 800,131" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="755" y="123" text-anchor="middle" font-size="11" fill="#475569">태그 = git SHA</text>
  <polyline points="580,162 580,196 300,196 300,162" fill="none" stroke="#94a3b8" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#ad)"/>
  <text x="430" y="212" text-anchor="middle" font-size="11" fill="#475569">deploy/values 이미지 태그 갱신 커밋 · [skip ci]</text>
  <polyline points="250,162 250,258" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="262" y="245" text-anchor="start" font-size="11" fill="#475569">deploy/ 경로만 감시</text>
  <polyline points="380,289 720,289" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="550" y="281" text-anchor="middle" font-size="11" fill="#475569">동기화 · prune · selfHeal</text>
  <polyline points="865,162 865,258" fill="none" stroke="#94a3b8" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#ad)"/>
  <text x="853" y="214" text-anchor="end" font-size="11" fill="#475569">이미지 pull</text>
</svg>
